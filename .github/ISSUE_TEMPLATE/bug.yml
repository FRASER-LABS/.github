name: Bug
description: Something is broken or wrong.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Commands, URLs, or clicks. Paste real output.
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: Branch, deployed URL, or tier (dev / prod).
